<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 皇家閱讀魔法森林 - 雲端同步版</title>
    <style>
        :root {
            --royal-purple: #6a5acd;
            --magic-gold: #ffd700;
            --vine-green: #2d6a4f;
            --disney-pink: #ffafcc;
            --bg-color: #fdfaf5;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: var(--bg-color);
            margin: 0; padding: 10px;
            color: #333;
        }

        /* 頂部總覽表 */
        .summary-table {
            background: white; border-radius: 20px; width: 100%;
            border-collapse: collapse; margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; font-size: 14px;
        }
        .summary-table th { background: var(--royal-purple); color: white; padding: 12px; }
        .summary-table td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }

        .overall-stats {
            display: flex; justify-content: space-around; padding: 15px;
            background: white; border-radius: 20px; margin-bottom: 20px;
            border: 2px solid var(--magic-gold);
        }
        .stat-box b { font-size: 20px; color: var(--royal-purple); }

        /* 養殖卡片區 */
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 45px 25px; padding-top: 40px;
        }

        .animal-card {
            background: white; border-radius: 35px; border: 4px solid white;
            outline: 2px solid var(--vine-green); position: relative;
            padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center;
        }

        /* 漂浮動物頭像 */
        .avatar-circle {
            width: 100px; height: 100px; background: white;
            border: 5px solid var(--vine-green); border-radius: 50%;
            position: absolute; top: -55px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 55px; box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -15px); }
        }

        .deco-vine { position: absolute; top: 10px; right: 15px; font-size: 18px; color: var(--magic-gold); }
        .month-name { font-size: 22px; font-weight: bold; color: var(--royal-purple); margin-top: 45px; }

        /* 進度條 */
        .progress-container {
            background: #eee; height: 14px; border-radius: 7px;
            margin: 15px 0; overflow: hidden; border: 1px solid #ddd;
        }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ffafcc, #ff85a1); transition: 1.5s; width: 0%; }

        /* 輸入與清單 */
        .input-group { display: flex; gap: 8px; margin: 15px 0; }
        input { flex: 1; border: 1.5px solid #eee; padding: 10px; border-radius: 12px; outline: none; }
        .magic-btn { background: var(--royal-purple); color: white; border: none; padding: 0 15px; border-radius: 12px; cursor: pointer; }
