<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 皇家奇幻閱讀動物園</title>
    <style>
        :root {
            --royal-purple: #7851a9;
            --magic-gold: #ffcf40;
            --vine-green: #008080;
            --soft-pink: #ffc0cb;
            --bg-color: #fdfaf5;
            --border-color: #ff7f50;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: var(--bg-color);
            margin: 0; padding: 15px;
        }

        /* 年度總覽區 */
        .header-stats {
            display: flex; justify-content: space-around;
            background: white; border-radius: 25px; padding: 20px;
            margin-bottom: 30px; border: 3px solid var(--magic-gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .header-stats b { font-size: 24px; color: var(--royal-purple); }

        /* 總覽表格 */
        .summary-table {
            width: 100%; background: white; border-collapse: collapse;
            border-radius: 20px; overflow: hidden; margin-bottom: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .summary-table th { background: var(--royal-purple); color: white; padding: 12px; }
        .summary-table td { text-align: center; padding: 10px; border-bottom: 1px solid #eee; }

        /* 卡片佈局 */
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 70px 25px; padding-top: 50px;
        }

        .animal-card {
            background: white; border-radius: 40px; border: 4px solid white;
            outline: 2.5px solid var(--border-color); position: relative;
            padding: 25px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        /* 五階大圖示 */
        .avatar-circle {
            width: 130px; height: 130px; background: white;
            border: 5px solid var(--vine-green); border-radius: 50%;
            position: absolute; top: -75px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .month-name { font-size: 26px; font-weight: bold; color: var(--royal-purple); margin-top: 60px; }
        
        /* 進度條 */
        .progress-box {
            background: #eee; height: 18px; border-radius: 10px;
            margin: 20px 0; overflow: hidden; border: 1px solid #ddd;
        }
        .bar { height: 100%; background: linear-gradient(90deg, #ff7f50, #ff69b4); width: 0%; transition: 1s; }

        /* 三級評價選擇器 */
        .rating-picker {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;
        }
        .rating-btn {
            font-size: 24px; cursor: pointer; opacity: 0.3; transition: 0.3s;
        }
        .rating-btn.active { opacity: 1; transform: scale(1.2); }

        /* 輸入區 */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border-radius: 15px; border: 1.5px solid #ddd; font-size: 16px; }
        .add-btn { background: var(--royal-purple); color: white; border: none; padding: 0 20px; border-radius: 15px; cursor: pointer; font-size: 22px; }

        /* 紀錄列表 */
        .log-container {
            max-height: 140px; overflow-y: auto; text-align: left;
            background: #f9f9f9; border-radius: 15px; padding: 8px;
        }
        .log-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .del-btn { color: #ffafcc; cursor: pointer; border: none; background: none; }

        /* 同步狀態提示 */
        #sync-msg {
            position: fixed; top: 10px; right: 10px; padding: 8px 15px;
            background: rgba(0,0,0,0.7); color: white; border-radius: 20px;
            font-size: 12px; display: none; z-index: 1000;
        }
    </style>
</head>
<body>

<div id="sync-msg">魔法同步中...</div>

<div class="header-stats">
    <div>2026 年度閱讀量：<b id="total-val">0</b> 本</div>
    <div>城堡守護獸：<b id="castle-val">0</b> 隻</div>
</div>

<table class="summary-table">
    <thead>
        <tr><th>月份</th><th>進化狀態</th><th>本數</th><th>達成率</th></tr>
    </thead>
    <tbody id="table-body"></tbody>
</table>

<div class="grid-container" id="card-root"></div>

<script>
    // --- 請填入部署後的網址 ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxip4kg0F7D9EJj2vqxdejkSDCcRcSNEzOe8OhBw2PhaCaeqjlQ6SKWUnEoKsXTVmY/exec"; 

    const CONFIG = [
        { m: 1, name: "一月", animal: "長頸鹿", icons: ["🥚", "🦒", "🦒🎀", "🦒👑", "🦒🏰"] },
        { m: 2, name: "二月", animal: "狐狸", icons: ["🥚", "🦊", "🦊🎀", "🦊👑", "🦊🏰"] },
        { m: 3, name: "三月", animal: "狗狗", icons: ["🥚", "🐶", "🐶🎀", "🐕‍🦺👑", "🐕‍🦺🏰"] },
        { m: 4, name: "四月", animal: "大象", icons: ["🥚", "🐘", "🐘🎀", "🐘👑", "🐘🏰"] },
        { m: 5, name: "五月", animal: "變色龍", icons: ["🥚", "🦎", "🦎🎀", "🌈🦎", "🌈🏰"] },
        { m: 6, name: "六月", animal: "腕龍", icons: ["🥚", "🦕", "🦕🎀", "🦕👑", "🦕🏰"] },
        { m: 7, name: "七月", animal: "貓咪", icons: ["🥚", "🐱", "🐱🎀", "🐈👑", "🐈🏰"] },
        { m: 8, name: "八月", animal: "暴龍", icons: ["🥚", "🦖", "🦖🎀", "🦖🔥", "🦖🏰"] },
        { m: 9, name: "九月", animal: "泰迪熊", icons: ["🥚", "🧸", "🧸🎀", "🧸👑", "🧸🏰"] },
        { m: 10, name: "十月", animal: "兔子", icons: ["🥚", "🐰", "🐰🎀", "🐇🌙", "🐇🏰"] },
        { m: 11, name: "十一月", animal: "鴨子", icons: ["🥚", "🐥", "🐥🎀", "🦆👑", "🦆🏰"] },
        { m: 12, name: "十二月", animal: "老虎", icons: ["🥚", "🐯", "🐯🎀", "🐯👑", "🐯🏰"] }
    ];

    let storage = JSON.parse(localStorage.getItem("disney_zoo_v6")) || {};
    let currentRating = "😊"; // 預設滿意度

    // 同步雲端資料 (雙向連結)
    async function syncData() {
        if (!SCRIPT_URL || SCRIPT_URL.includes("你的")) { render(); return; }
        document.getElementById('sync-msg').style.display = 'block';
        try {
            const res = await fetch(SCRIPT_URL);
            const cloudData = await res.json();
            
            // 合併邏輯：以 ID 作為唯一值避免重複
            cloudData.forEach(item => {
                const m = parseInt(item.month);
                if (!storage[m]) storage[m] = [];
                const exists = storage[m].some(b => b.title === item.title && b.id === item.timestamp);
                if (!exists) {
                    storage[m].push({ id: item.timestamp, title: item.title, rating: item.rating });
                }
            });
            localStorage.setItem("disney_zoo_v6", JSON.stringify(storage));
        } catch (e) { console.log("離線模式"); }
        finally {
            document.getElementById('sync-msg').style.display = 'none';
            render();
        }
    }

    // 評分切換
    function setRating(m, rating, el) {
        currentRating = rating;
        const btns = el.parentElement.querySelectorAll('.rating-btn');
        btns.forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    async function addEntry(m) {
        const input = document.getElementById(`in-${m}`);
        const title = input.value.trim();
        if (!title) return;

        const timestamp = Date.now();
        if (!storage[m]) storage[m] = [];
        const entry = { id: timestamp, title, rating: currentRating };
        
        storage[m].push(entry);
        localStorage.setItem("disney_zoo_v6", JSON.stringify(storage));
        render();
        input.value = "";

        // 發送雲端 (不阻斷)
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ month: m, title: title, rating: currentRating })
        });
    }

    function removeEntry(m, id) {
        if(!confirm("移除本地紀錄？(雲端需手動刪除)")) return;
        storage[m] = storage[m].filter(x => x.id !== id);
        localStorage.setItem("disney_zoo_v6", JSON.stringify(storage));
        render();
    }

    function render() {
        const grid = document.getElementById("card-root");
        const table = document.getElementById("table-body");
        grid.innerHTML = ""; table.innerHTML = "";
        let totalAll = 0; let castleCount = 0;

        CONFIG.forEach(cfg => {
            const list = storage[cfg.m] || [];
            const count = list.length;
            totalAll += count;

            // 五階進化
            let stage = 0;
            if (count >= 11 && count <= 19) stage = 1;
            else if (count >= 20 && count <= 29) stage = 2;
            else if (count >= 30 && count <= 39) stage = 3;
            else if (count >= 40) { stage = 4; castleCount++; }

            const percent = Math.min((count / 40) * 100, 100).toFixed(0);

            // 更新表格
            table.innerHTML += `<tr><td>${cfg.name}</td><td>${cfg.icons[stage]}</td><td>${count} 本</td><td>${percent}%</td></tr>`;

            // 更新卡片
            const card = document.createElement("div");
            card.className = "animal-card";
            card.innerHTML = `
                <div class="avatar-circle">${cfg.icons[stage]}</div>
                <div class="month-name">${cfg.name}</div>
                <div class="progress-box"><div class="bar" style="width: ${percent}%"></div></div>
                <div class="rating-picker">
                    <span class="rating-btn active" onclick="setRating(${cfg.m}, '❤️', this)">❤️</span>
                    <span class="rating-btn" onclick="setRating(${cfg.m}, '😊', this)">😊</span>
                    <span class="rating-btn" onclick="setRating(${cfg.m}, '😐', this)">😐</span>
                </div>
                <div class="input-group">
                    <input type="text" id="in-${cfg.m}" placeholder="書名...">
                    <button class="add-btn" onclick="addEntry(${cfg.m})">🪄</button>
                </div>
                <div class="log-container">
                    ${list.slice().reverse().map(b => `
                        <div class="log-item">
                            <span>${b.rating || '😊'} ${b.title}</span>
                            <button class="del-btn" onclick="removeEntry(${cfg.m}, ${b.id})">✕</button>
                        </div>
                    `).join('')}
                </div>
            `;
            grid.appendChild(card);
        });

        document.getElementById("total-val").innerText = totalAll;
        document.getElementById("castle-val").innerText = castleCount;
    }

    window.onload = syncData;
</script>
</body>
</html>
